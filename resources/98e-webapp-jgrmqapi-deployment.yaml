---
# ──────────────────────────────────────────────────────────────────────────────
# Deployment – single-pod web app for JGRMQAPI contact submission
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jgrmqapi-web
  labels:
    app: jgrmqapi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jgrmqapi-web
  template:
    metadata:
      labels:
        app: jgrmqapi-web
    spec:
      containers:
        - name: jgrmqapi-web
          # Replace with your actual image registry/path after building
          image: quay.io/jgomezr/jgrmqapi-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jgrmqapi-web-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/config
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Always
