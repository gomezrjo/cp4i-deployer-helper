apiVersion: v1
kind: Namespace
metadata:
  name: datapower-nano-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datapower-nano-operator
  namespace: ${NS_NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datapower-nano-operator
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - nano.datapower.ibm.com
    resources:
      - apis
      - apisets
      - assemblies
      - autoscaleconfigs
      - jwtproviders
      - managements
      - mcptools
      - mcpprompts
      - mcpresources
      - oauthproviders
      - runtimeconfigs
      - runtimes
      - tlsclientprofiles
      - tlsserverprofiles
      - userdefinedpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - nano.datapower.ibm.com
    resources:
      - apis/status
      - apisets/status
      - assemblies/status
      - autoscaleconfigs/status
      - jwtproviders/status
      - managements/scale
      - managements/status
      - mcptools/status
      - mcpprompts/status
      - mcpresources/status
      - oauthproviders/status
      - runtimeconfigs/status
      - runtimes/scale
      - runtimes/status
      - tlsclientprofiles/status
      - tlsserverprofiles/status
      - userdefinedpolicies/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ''
    resources:
      - configmaps
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - idig.datapower.ibm.com
    resources:
      - idigruntimes
      - idigruntimeconfigs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - idig.datapower.ibm.com
    resources:
      - idigruntimes/finalizers
    verbs:
      - update
  - apiGroups:
      - idig.datapower.ibm.com
    resources:
      - idigruntimes/status
      - idigruntimes/scale
      - idigruntimeconfigs/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datapower-nano-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datapower-nano-operator
subjects:
  - kind: ServiceAccount
    name: datapower-nano-operator
    namespace: ${NS_NAME}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idig-gw-operator
  namespace: ${NS_NAME}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idig-gw-operator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idig-gw-operator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
      - env:
        - name: IDIG_LABEL_SELECTOR
          value: "managed-by!=XXXXXXXXXXXXXXXXXXX"
        - name: RUST_LOG
          value: idig_operator=info
        - name: RUST_BACKTRACE
          value: "1"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: ${IDIG_IMG_REGISTRY}/idig-gw-operator:12.1.1.3.40-20261014154705
        imagePullPolicy: Always
        name: datapower-idig-operator
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: idig-registry-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
      serviceAccountName: datapower-nano-operator
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: idig-gw-operator
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway