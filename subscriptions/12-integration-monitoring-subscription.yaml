apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ibm-integration-monitoring
  namespace: openshift-operators
spec:
  channel: v${SUB_VER}${SUB_EXT}
  name: ibm-integration-monitoring
  source: ibm-integration-monitoring-catalog
  sourceNamespace: openshift-marketplace
  config:
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"