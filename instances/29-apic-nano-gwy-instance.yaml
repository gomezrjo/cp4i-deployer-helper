kind: NanoGatewayCluster
apiVersion: nanogateway.apiconnect.ibm.com/v1beta1
metadata:
  name: ${INST_NAME}
spec:
  certManagerIssuer:
    kind: Issuer
    name: ${DINST_NAME}-self-signed
  gatewayDomain: nanogw.${STACK_HOST}
  license:
    accept: true
    license: ${INST_LIC}
    metric: PROCESSOR_VALUE_UNIT
    use: nonproduction
  mgmtClientSubjectDN: 'CN=nano-gateway-mgmt-client'
  mgmtEndpoint:
    annotations:
      cert-manager.io/issuer: ${DINST_NAME}-ingress-issuer
  microServiceSecurity: certManager
  profile: ${INST_PROFILE}
  redis:
    credential:
      secretName: valkey-secret
    hosts:
      - ${VALKEY_INST_NAME}.${VALKEY_NAMESPACE}.svc.cluster.local
    mode: standalone
    port: 6379
    tls:
      secretName: valkey-tls
  version: ${INST_VER}